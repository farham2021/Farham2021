name: Accounting mobile builds
on:
  workflow_dispatch:
  push:
    paths:
      - 'accounting/mobile/**'
      - '.github/workflows/accounting-mobile-build.yml'
jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Create Android shell
        working-directory: accounting/mobile
        run: |
          mkdir -p www
          cp ../index.html ../manifest.webmanifest ../icon.svg ../sw.js www/
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ali-finance-android-debug-apk
          path: accounting/mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
  ios-simulator:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Create iOS simulator shell
        working-directory: accounting/mobile
        run: |
          mkdir -p www
          cp ../index.html ../manifest.webmanifest ../icon.svg ../sw.js www/
          npm install --no-audit --no-fund
          npx cap add ios
          npx cap sync ios
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator -derivedDataPath ios/build CODE_SIGNING_ALLOWED=NO build
          cd ios/build/Build/Products/Debug-iphonesimulator
          zip -qr "$GITHUB_WORKSPACE/ali-finance-ios-simulator.zip" App.app
      - uses: actions/upload-artifact@v4
        with:
          name: ali-finance-ios-simulator-unsigned
          path: ali-finance-ios-simulator.zip
          if-no-files-found: error
