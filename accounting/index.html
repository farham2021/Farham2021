<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حسابداری شخصی</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>body{font-family:system-ui;background:#101d31;color:#f2f6ff;margin:0;padding:18px}main{max-width:780px;margin:auto}section{background:#20314b;border-radius:14px;padding:16px;margin:12px 0}button{padding:12px;background:#5b9aff;color:white;border:0;border-radius:9px}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #456}small{color:#b8c5d8}</style></head><body><main><h2>دفتر حسابداری شخصی</h2><small>نمایش امن و فقط خواندنی داده‌های ثبت‌شده در بات تلگرام</small><section id="status">در حال احراز هویت...</section><section id="summary"></section><section><h3>حساب‌ها</h3><div id="accounts"></div></section><section><h3>آخرین تراکنش‌ها</h3><div id="entries"></div></section><button onclick="load()">بروزرسانی</button></main><script>
const t=window.Telegram?.WebApp;t?.ready();t?.expand();function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function money(n){return Number(n||0).toLocaleString('fa-IR')+' ریال'}async function load(){let el=document.getElementById('status');if(!t?.initData){el.textContent='این صفحه باید از داخل بات تلگرام باز شود.';return}try{let r=await fetch('https://dhasxrsnrubryjnictzi.supabase.co/functions/v1/finance-web',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData:t.initData})});if(!r.ok)throw Error('احراز هویت یا دریافت داده ناموفق بود');let d=await r.json();el.textContent='اطلاعات حساب شما به‌صورت فقط خواندنی نمایش داده می‌شود.';document.getElementById('summary').textContent='تعداد تراکنش‌های اخیر: '+d.entries.length+' | حساب‌ها: '+d.accounts.length;document.getElementById('accounts').innerHTML='<table><tr><th>حساب</th><th>موجودی افتتاحیه</th></tr>'+d.accounts.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+money(x.opening_irr)+'</td></tr>').join('')+'</table><small>مبالغ این جدول موجودی افتتاحیه هستند، نه مانده روز.</small>';document.getElementById('entries').innerHTML='<table><tr><th>تاریخ</th><th>نوع</th><th>مبلغ</th></tr>'+d.entries.map(x=>'<tr><td>'+esc((x.occurred_at||'').slice(0,10))+'</td><td>'+esc(x.kind)+'</td><td>'+money(x.amount_irr)+'</td></tr>').join('')+'</table>'}catch(e){el.textContent=String(e.message||e)}}load();
</script></body></html>
